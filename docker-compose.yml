version: '3.8'

services:
  mysql-curriculum-skill:
    build:
      context: .
      dockerfile: mysql/Dockerfile
    container_name: mysql-curriculum-skill
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: skillcrawl
    ports:
      - "5003:3306"
    volumes:
      - curriculum-skills_mysql:/var/lib/mysql
    labels:
      io.portainer.accesscontrol.teams: skillab-all
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  curriculum-skills:
    depends_on:
      mysql-curriculum-skill:
        condition: service_healthy
    container_name: curriculum-skills
    build: .
    image: ${DOCKER_REG}${DOCKER_REPO}${APP_NAME}:${DOCKER_TAG}
    ports:
      - "5002:8000"
    volumes:
      - curriculum-curriculum:/app/curriculum
      - curriculum-crawler_json:/app/crawler_json
      - skill-gap-longterm:/app/longterm_storage
      - ./data/esco:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - UVICORN_WORKERS=1
      - DB_HOST=mysql-curriculum-skill
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=skillcrawl
      - LONGTERM_STORAGE_DIR=/app/longterm_storage
      - API_TRACKER_BASE_URL=https://skillab-tracker.csd.auth.gr/api
      - TRENDS_API_BASE_URL=https://portal.skillab-project.eu/future-technology-trends-identifier
      - REQUIRED_SKILLS_SERVICE_URL=https://portal.skillab-project.eu/diversity-analysis
      - API_URL=http://160.40.52.27:3000
      - API_TOKEN=${API_TOKEN}
      - MODEL_NAME=mistral:latest
    command: >
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/curriculum-skills/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      io.portainer.accesscontrol.teams: skillab-all
    extra_hosts:
      - "host.docker.internal:host-gateway"
      

volumes:
  curriculum-skills_mysql:
    labels:
      io.portainer.accesscontrol.teams: skillab-all
  curriculum-curriculum:
    labels:
      io.portainer.accesscontrol.teams: skillab-all
  curriculum-crawler_json:
    labels:
      io.portainer.accesscontrol.teams: skillab-all
  skill-gap-longterm:
    labels:
      io.portainer.accesscontrol.teams: skillab-all
